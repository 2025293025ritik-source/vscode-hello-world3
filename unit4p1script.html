<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Fundamentals</title>
</head>
<body>

<h2>Check Console for Output</h2>

<script>

    // Variables (let, const)
    let number = 7;
    const name = "Ritik";

    console.log("Name:", name);

    // Function to check prime number
    function checkPrime(num) {
        let isPrime = true;

        if (num <= 1) {
            isPrime = false;
        } else {
            for (let i = 2; i < num; i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }

        if (isPrime)
            console.log(num + " is Prime");
        else
            console.log(num + " is Not Prime");
    }

    checkPrime(number);

    // Multiplication table (for loop)
    console.log("Multiplication Table of 5:");
    for (let i = 1; i <= 10; i++) {
        console.log("5 x " + i + " = " + (5 * i));
    }

    // While loop
    let i = 1;
    console.log("While Loop Output:");
    while (i <= 5) {
        console.log(i);
        i++;
    }

    // Find largest number in array
    let arr = [10, 25, 5, 40, 15];
    let largest = arr[0];

    for (let i = 1; i < arr.length; i++) {
        if (arr[i] > largest) {
            largest = arr[i];
        }
    }

    console.log("Largest Number:", largest);

    // Conditional statements (if & switch)
    let day = 2;

    if (day === 1) {
        console.log("Monday");
    } else {
        console.log("Not Monday");
    }

    switch(day) {
        case 1:
            console.log("Monday");
            break;
        case 2:
            console.log("Tuesday");
            break;
        default:
            console.log("Other Day");
    }

</script>

</body>
</html>
