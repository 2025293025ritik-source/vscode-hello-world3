<!DOCTYPE html>
<html>
<head>
    <title>My Blog Page</title>
</head>
<body>

    <header style="background-color: lightblue; padding: 10px;">
        <h1>My Blog</h1>
    </header>

    <nav style="background-color: lightgray; padding: 10px;">
        <a href="#">Home</a> |
        <a href="#">Articles</a> |
        <a href="#">Contact</a>
    </nav>

    <main>

        <section>
            <h2>Latest Articles</h2>

            <article style="border: 1px solid black; margin: 10px; padding: 10px;">
                <h3>Article 1</h3>
                <p>This is the first article.</p>
                <img src="https://via.placeholder.com/200" alt="Sample Image 1">
            </article>

            <article style="border: 1px solid black; margin: 10px; padding: 10px;">
                <h3>Article 2</h3>
                <p>This is the second article.</p>
                <img src="https://via.placeholder.com/200" alt="Sample Image 2">
            </article>

        </section>

        <aside style="background-color: #f2f2f2; padding: 10px;">
            <h3>Related Links</h3>
            <ul>
                <li><a href="#">Learn HTML</a></li>
                <li><a href="#">Learn CSS</a></li>
            </ul>
        </aside>

        <section>
            <h2>Contact Form</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name"><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email"><br><br>

                <input type="submit" value="Submit">
            </form>
        </section>

    </main>

    <footer style="background-color: lightblue; padding: 10px;">
        <p>© 2026 My Blog</p>
    </footer>

</body>
</html>
